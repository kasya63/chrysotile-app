name: chrysotile_app
description: "Chrysotile mobile news reader for iOS and Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_widget_from_html_core: ^0.16.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.4.0
  package_info_plus: ^8.3.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon.png
  color_dark: "#0E1420"
  image_dark: assets/icon.png
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: assets/icon.png
    color_dark: "#0E1420"
    icon_background_color_dark: "#0E1420"
    image_dark: assets/icon.png
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logo_ch.png
    - assets/legal/
    - assets/icons/
    - assets/social/
    - assets/branding/